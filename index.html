<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DALJIR PUBLIC NOTARY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #0d47a1;
            --secondary-blue: #1976d2;
            --light-bg: #f4f7f6;
            --text-dark: #1e293b;
            --text-muted: #475569;
            --white: #ffffff;
            --font-main: 'Poppins', sans-serif;
            --font-heading: 'Montserrat', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--light-bg);
            color: var(--text-dark);
            line-height: 1.6;
        }

        /* Navigation */
        .navbar {
            background-color: var(--white);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-heading);
            font-weight: 800;
            font-size: 1.4rem;
            color: var(--primary-blue);
            text-decoration: none;
        }

        .brand i {
            font-size: 1.6rem;
        }

        /* Gallery Grid */
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .section-title {
            text-align: center;
            font-family: var(--font-heading);
            color: var(--primary-blue);
            margin-bottom: 2rem;
            font-size: 2rem;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--white);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .card-body {
            padding: 1.25rem;
            text-align: center;
        }

        .card-title {
            font-family: var(--font-heading);
            color: var(--primary-blue);
            font-size: 1.1rem;
            font-weight: 700;
        }

        footer {
            background-color: var(--primary-blue);
            color: var(--white);
            text-align: center;
            padding: 1.5rem;
            margin-top: 3rem;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="brand">
                <i class="fa-solid fa-stamp"></i>
                DALJIR NOTARY
            </a>
        </div>
    </nav>

    <main class="container">
        <h2 class="section-title">Sawirrada Xafiiska</h2>
        <div class="gallery-grid">
            
            <div class="card">
                <img src="1788100456368.jpg" alt="Daljir Notary Office 1" class="card-img">
                <div class="card-body">
                    <h3 class="card-title">Xafiiska Daljir</h3>
                </div>
            </div>

            <div class="card">
                <img src="1788100533355.jpg" alt="Daljir Notary Office 2" class="card-img">
                <div class="card-body">
                    <h3 class="card-title">Adeegyada Notary-ga</h3>
                </div>
            </div>

            <div class="card">
                <img src="IMG-20260319-WA0000.jpg" alt="Daljir Board" class="card-img">
                <div class="card-body">
                    <h3 class="card-title">Boodhka Xafiiska</h3>
                </div>
            </div>

            <div class="card">
                <img src="IMG-20260830-WA0000.jpg" alt="Office Archive" class="card-img">
                <div class="card-body">
                    <h3 class="card-title">Diiwaanka Xafiiska</h3>
                </div>
            </div>

        </div>
    </main>

    <footer>
        <p>&copy; 2026 Daljir Public Notary. All Rights Reserved.</p>
    </footer>

</body>
</html>
